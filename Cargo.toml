[package]
name = "dtsls"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.11"
regex = "1.13.1"
ropey = "1.6.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync"] }
tower-lsp = "0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-devicetree2 = "0.1.0"
ureq = "3.5.2"
walkdir = "2.5.0"
yaml-rust2 = "0.13.0"
