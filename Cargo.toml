[package]
name = "dtsls"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
regex = "1.13.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync", "time"] }
tower-lsp = "0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-devicetree2 = "0.1.0"
walkdir = "2.5.0"
yaml-rust2 = "0.13.0"
